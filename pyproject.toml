[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insion"
version = "1.0.1"
description = "Official Python client for the Insion API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Insion" }]
keywords = ["insion", "api", "sdk", "moderation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anyio>=3.0.0",
    "httpx>=0.21.2",
    "pydantic>=1.9.2,<3",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.0"]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "twine>=5.0.0",
]

[project.urls]
Documentation = "https://docs.insion.co"
Issues = "https://github.com/insion-co/python/issues"
Repository = "https://github.com/insion-co/python"

[tool.setuptools]
package-dir = { insion = "." }
packages = [
    "insion",
    "insion.core",
    "insion.core.http_sse",
    "insion.errors",
    "insion.types",
]

[tool.pytest.ini_options]
markers = ["aiohttp: tests that require the optional httpx-aiohttp transport"]
testpaths = ["tests"]
