name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    working-directory: /tmp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify release version
        run: |
          package_version="$(python -c 'import os, tomllib; path = os.path.join(os.environ["GITHUB_WORKSPACE"], "pyproject.toml"); print(tomllib.load(open(path, "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install package and release dependencies
        run: python -m pip install --upgrade --editable "${GITHUB_WORKSPACE}[aiohttp,dev]"

      - name: Test
        run: pytest "$GITHUB_WORKSPACE/tests"

      - name: Build distributions
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE"

      - name: Check distributions
        run: python -m twine check "$GITHUB_WORKSPACE"/dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
