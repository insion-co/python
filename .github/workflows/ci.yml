name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: /tmp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade --editable "${GITHUB_WORKSPACE}[aiohttp,dev]"

      - name: Test
        run: pytest "$GITHUB_WORKSPACE/tests"

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE"

      - name: Check distributions
        run: python -m twine check "$GITHUB_WORKSPACE"/dist/*

      - name: Test built wheel
        run: |
          python -m venv /tmp/insion-wheel-test
          /tmp/insion-wheel-test/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/insion-wheel-test/bin/python -c "from insion import AsyncInsionClient, InsionClient"
